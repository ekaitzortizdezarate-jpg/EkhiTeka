<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Fondo rojo -->
  <rect width="900" height="600" fill="#D52B1E"/>
  <!-- Aspa verde (San Andrés vasco) -->
  <line x1="0" y1="0" x2="900" y2="600" stroke="#007A3D" stroke-width="130"/>
  <line x1="900" y1="0" x2="0" y2="600" stroke="#007A3D" stroke-width="130"/>
  <!-- Cruz blanca (horizontal y vertical) -->
